<div id="outline-container-headline-1" class="outline-2">
<h2 id="headline-1">
Footnotes
</h2>
<div id="outline-text-headline-1" class="outline-text-2">
<p>A paragraph with a named reference<sup class="footnote-reference"><a id="footnote-reference-1" href="#footnote-1">1</a></sup> and another one<sup class="footnote-reference"><a id="footnote-reference-2" href="#footnote-2">2</a></sup>
plus an inline definition<sup class="footnote-reference"><a id="footnote-reference-3" href="#footnote-3">3</a></sup>.</p>
<ul>
<li>references again to <sup class="footnote-reference"><a id="footnote-reference-1" href="#footnote-1">1</a></sup> should not duplicate the definition</li>
</ul>
</div>
</div>
<div class="footnotes">
<hr class="footnotes-separatator"/>
<div class="footnote-definitions">
<div class="footnote-definition">
<sup id="footnote-1"><a href="#footnote-reference-1">1</a></sup>
<div class="footnote-body">
<p>The first definition with <strong>markup</strong>.</p>
</div>
</div>
<div class="footnote-definition">
<sup id="footnote-2"><a href="#footnote-reference-2">2</a></sup>
<div class="footnote-body">
<p>The second definition.</p>
</div>
</div>
<div class="footnote-definition">
<sup id="footnote-3"><a href="#footnote-reference-3">3</a></sup>
<div class="footnote-body">
<p>the inline body</p>
</div>
</div>
</div>
</div>
